name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - deploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Environment Configuration
        run: |
          if [ -z "${{ secrets.VITE_OMDB_API_KEY || vars.VITE_OMDB_API_KEY }}" ]; then
            echo "::warning title=Missing VITE_OMDB_API_KEY::VITE_OMDB_API_KEY is not set in GitHub Secrets/Variables."
          fi
          if [ -z "${{ secrets.VITE_WHATSON_API_KEY || vars.VITE_WHATSON_API_KEY }}" ]; then
            echo "::warning title=Missing VITE_WHATSON_API_KEY::VITE_WHATSON_API_KEY is not set in GitHub Secrets/Variables."
          fi
          if [ -z "${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}" ]; then
            echo "::warning title=Missing VITE_FIREBASE_API_KEY::VITE_FIREBASE_API_KEY is not set in GitHub Secrets/Variables."
          fi

      - name: Build project
        env:
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY || vars.VITE_OMDB_API_KEY }}
          VITE_WHATSON_API_KEY: ${{ secrets.VITE_WHATSON_API_KEY || vars.VITE_WHATSON_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
